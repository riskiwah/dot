# T14 Gen 3 battery tune, ported from l390/tlp.d/10-l390.conf.
# Deploy: sudo install -m 644 10-t14.conf /etc/tlp.d/ && sudo tlp start
# Side effects: overrides /etc/tlp.conf for the keys below only.
# Rollback: sudo rm /etc/tlp.d/10-t14.conf && sudo tlp start
# Measure with scripts/powerbench.sh before and after (unplugged).

# Measured with scripts/powerbench.sh: 'low-power' idled the same as 'balanced'
# (7.69 W vs 7.59 W) and only risks a slower feel, so battery stays 'balanced'.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced

# Keep the BIOS ASPM setup on battery: 'powersave' drops NVMe L1.1/L1.2
# substates, which capped the package at pc3 (AC with 'default' reached pc8).
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default

# Wi-Fi radio power saving is cheap on battery and irrelevant on AC.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# HDA codec power gating; may cause a pop on resume, disable if annoying.
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1

# Keep PCI devices that can runtime-suspend from staying awake on battery.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
