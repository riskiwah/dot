# TP35 Pro USB headset crackles ("brrt") at the default 32-bit/small-buffer settings.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-EPZ_Technology_TP35_Pro*" } ]
    actions = {
      update-props = {
        audio.format = "S24_3LE"
        api.alsa.period-size = 1024
        api.alsa.headroom = 512
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
