# ThinkPad L390 (i7-8565U, single NVMe, Intel Wi-Fi). TLP 1.10 drop-in: /etc/tlp.d/10-l390.conf
# CPU power limits and undervolt are owned by throttled (thinkpad/l390/throttled.conf); do not set
# CPU_MAX_PERF_*/CPU_SCALING_M*_FREQ here.
TLP_ENABLE=1

# CPU (intel_pstate + HWP)
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
# turbo/dynamic boost off on battery, matching the t14-G3 tlp.conf in this repo (the old l390
# tlp.conf never set it, so it stayed on). Battery is also capped at 15 W by throttled.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# battery health (native thinkpad_acpi thresholds, same as before)
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# USB: autosuspend, but keep the TP35 Pro headset (pops) and fingerprint reader out of it
USB_AUTOSUSPEND=1
USB_DENYLIST="3302:43e6 06cb:00a2"

# Wi-Fi / audio / PCIe / runtime PM (conservative; no powersupersave)
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
